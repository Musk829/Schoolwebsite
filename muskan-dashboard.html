<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muskan - SPS Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#eef2f7}
.top{background:#1e3a8a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}
.card{background:#fff;margin:12px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.profile{display:flex;gap:14px;align-items:center}
.profile img{width:85px;height:85px;border-radius:50%;object-fit:cover;border:3px solid #1e3a8a}
.badge{background:#2563eb;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}
.addr{font-size:13px;color:#555;margin-top:4px}
.bar{height:10px;background:#e5e7eb;border-radius:10px;margin-top:8px}
.fill{width:92.5%;height:10px;background:#22c55e;border-radius:10px}
</style>
</head>
<body>

<div class="top"><b>SPS SAHARANPUR</b><span>🔔 Muskan | BCA</span></div>

<div class="card profile">
<img src="muskan.jpg">
<div>
<h2>Muskan</h2>
<span class="badge">BCA • Final Year</span>
<p class="addr">📍 SPS Saharanpur</p>
<p class="addr"><b>Address:</b> Near Clock Tower, Saharanpur, UP - 247001</p>
<!-- Yaha apna full address likh do -->
</div>
</div>

<div class="card">
<b>Attendance - 92.5% ✅</b>
<div class="bar"><div class="fill"></div></div>
<small>Present: 74 / Total: 80 classes</small>
</div>

<div class="card">
<h3>STUDENT DASHBOARD</h3>
<p>Welcome back, Muskan ❤️</p>
<p>Name: <b>Muskan</b></p>
<p>College: SPS Saharanpur</p>
<p>Course: BCA Final Year</p>
</div>

</body>
</html>
